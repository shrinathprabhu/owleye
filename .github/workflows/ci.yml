name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @owleye/analytics test
      - run: pnpm --filter @owleye/console test
      - run: pnpm --filter @owleye/console typecheck
      - run: pnpm --filter @owleye/console build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node --test scripts/*.test.mjs
