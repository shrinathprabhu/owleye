packages:
  - "apps/*"
  - "packages/*"

# Project-level pnpm settings belong here in pnpm 10. Keeping overrides under
# package.json#pnpm makes pnpm ignore them in a workspace.
overrides:
  "@babel/core": 7.29.6
  "brace-expansion@2": 2.1.4
  "brace-expansion@5": 5.0.9
  browserslist: 4.28.7
  devalue: 5.9.2
  "nanoid@3": 3.3.18
  esbuild: 0.28.1
  fast-uri: 3.1.6
  js-yaml: 4.3.2
  launch-editor: 2.14.1
  postcss: 8.5.28
  "postcss-selector-parser@6": 6.1.3
  "postcss-selector-parser@7": 7.1.3
  sharp: 0.35.4
  shell-quote: 1.9.0
  svgo: 4.1.0
  smol-toml: 1.7.1
  tar: 7.5.21
  ws: 8.21.0
  yaml: 2.8.3

# Give the ecosystem time to detect and withdraw compromised publications,
# and reject unexpected transitive git/tarball sources.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# esbuild resolves its platform binary through optional dependencies;
# OwlEye does not need to run its fallback downloader during installation.
ignoredBuiltDependencies:
  - esbuild
